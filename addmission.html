    <h1>Online Learning</h1>

    <h2>Addmission Form</h2>
    <p>Please fill out the form below to enroll in your desired course.</p>

    <form>

        <label>Full Name:</label><br>
        <input type="text" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label>Select Course:</label><br>
        <select name="course">
            <option value="">-- Select a Course --</option>
            <option>HTML & CSS</option>
            <option>JavaScript</option>
            <option>Python Programming</option>
            <option>Web Development</option>
            <option>Graphic Designing</option>
            <option>Digital Marketing</option>
        </select>
        <br><br>

        <label>Education:</label><br>
        <input type="text" name="education" placeholder="Enter your qualification">
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
        <br><br>
        <br>

        <input type="submit" value="Submit Admission Form">
        <input type="reset" value="Reset">

    </form>
